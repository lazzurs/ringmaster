expect = [
  { match = "homeassistant/HassMediaPause", when_any = { "/name" = "*tv*", "/area" = "*living room*" } },
  { match = "homeassistant/call_action", when = { "/action" = "media_player.media_pause", "/target/entity_id" = "*tv*" } },
]

[[case]]
id = "kitchen-music-resume"
category = "media"
gesture = "double-click-hold"
transcript = "resume the music in the kitchen"
expect = [
  { match = "homeassistant/HassMediaUnpause", when_any = { "/name" = "*kitchen*", "/area" = "*kitchen*" } },
  { match = "homeassistant/call_action", when = { "/action" = "media_player.media_play", "/target/entity_id" = "*kitchen*" } },
]

[[case]]
id = "tv-misheard-on-paws"
category = "misheard"
gesture = "double-click-hold"
transcript = "on paws the TV"
note = "Misheard 'un-pause' or 'pause'; the TV is playing, so pausing is the sensible reading. Turning it on or off is wrong."
expect = [
  { match = "homeassistant/HassMediaPause", when_any = { "/name" = "*tv*", "/area" = "*living room*" } },
  { match = "homeassistant/HassMediaUnpause", when_any = { "/name" = "*tv*", "/area" = "*living room*" } },
  { match = "homeassistant/call_action", when = { "/action" = "media_player.media_{pause,play}", "/target/entity_id" = "*tv*" } },
]

