[package]
name = "ringmaster"
version = "0.1.5"
edition = "2024"
rust-version = "1.89"
description = "Voice commands from a smart ring: webhook receiver, local transcription, LLM agent (Claude, OpenAI, Mistral, OpenRouter, Ollama) with MCP tools, ntfy notifications"
license = "GPL-3.0-or-later"
repository = "https://github.com/lazzurs/ringmaster"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
hmac = "0.13"
hound = "3.5"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
multer = "3"
rand = "0.10"
reqwest = { version = "0.13", features = ["json", "multipart"] }
rmcp = { version = "3.11", default-features = false, features = ["client", "reqwest", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs"] }
tokio-util = "0.7"
toml = "1"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[dev-dependencies]
rmcp = { version = "3.11", default-features = false, features = ["client", "server", "macros", "reqwest", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
schemars = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
