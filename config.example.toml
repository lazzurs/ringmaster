# Ringmaster configuration.
#
# Secrets are NOT set here. They come from the environment (or <NAME>_FILE):
#   ANTHROPIC_API_KEY            Claude API key (if a profile uses anthropic)
#   OPENAI_API_KEY               OpenAI API key (if a profile uses openai)
#   MISTRAL_API_KEY              Mistral API key (if a profile uses mistral)
#   OPENROUTER_API_KEY           OpenRouter API key (if a profile uses openrouter)
#                                (Ollama needs no key)
#   RINGMASTER_WEBHOOK_SECRET    the ring app's signing secret (>= 32 chars)
#   NTFY_TOKEN                   ntfy access token (optional)
#   <approval.api_key_env>       bearer token for the approval classifier (optional)
#   <token_env of an MCP server> bearer token for that server (optional)

[server]
listen = "0.0.0.0:8080"
# The Cloudflare Tunnel hostname; used for the Approve/Deny buttons.
public_base_url = "https://ring.example.com"
data_dir = "/data"
max_body_bytes = 26214400
# On SIGTERM, in-flight requests and jobs get this long to finish; jobs still
# running are requeued at the next start. Keep it below the container's stop
# timeout (Docker's default is 10 s; the compose example sets
# stop_grace_period: 30s for 25 here).
shutdown_grace_secs = 8

[webhook]
path = "/webhook"
require_signature = true
timestamp_tolerance_secs = 300
notify_test_events = true

[stt]
# whisper.cpp whisper-server on the Mac (docs/mac-transcription.md).
primary_url = "http://mac-mini.lan:8178"
# fallback_url = "http://macbook.lan:8178"
language = "en"
# Biases recognition towards your own names. Keep it short and specific.
# Put your own Deck board and list names here.
vocabulary = [
  "Deck", "Inbox", "Nextcloud",
  "Shopping", "House", "Work",
]
# Use the phone's transcription (Pebble app "Both" mode) if no whisper server answers.
use_phone_transcription = true
timeout_secs = 120
# Decoding the M4A is bounded: recordings over max_audio_bytes or longer than
# max_audio_secs are not decoded, and decoding stops after decode_timeout_secs.
# In each case the phone's transcription is used instead. decode_concurrency
# caps the decoder threads (a decoder that hangs keeps its thread).
max_audio_bytes = 26214400
max_audio_secs = 600
decode_timeout_secs = 60
decode_concurrency = 1

# ------------------------------------------------------------------------ LLM
# Keys directly under [llm] describe the default provider; [llm.<provider>]
# tables configure one provider (and win over [llm]). Profiles can pick a
# different provider and model (see [profiles.capture] below).
#
# Everything except a local Ollama sends the transcript, the tool definitions
# and every tool result to that provider.
#
# The old [claude] section still works: it is the Anthropic configuration
# (api_base, model, effort, max_tokens, max_iterations, refusal_fallbacks,
# request_timeout_secs, max_retries), and [llm] settings take precedence.

[llm]
# anthropic (default) | openai | mistral | openrouter | ollama
provider = "anthropic"
# Required for every provider except anthropic (default claude-opus-5-5).
# Claude: claude-opus-5-5, claude-sonnet-5-5 or claude-haiku-5-5.
model = "claude-opus-5-5"
# Claude: low | medium | high | xhigh | max. Short home-automation commands do
# well on low. For other providers effort is only sent when set.
effort = "low"
# Output limit, thinking included (Claude default 16000; others: provider default).
max_tokens = 16000
# Model calls per job, whatever the provider.
max_iterations = 8
max_retries = 4

[llm.anthropic]
# auto = on for Opus/Sonnet, off for Haiku (which has no server-side fallback).
refusal_fallbacks = "auto"

# OpenAI (Chat Completions). Use a model that does function calling on Chat
# Completions, e.g. gpt-6.2-sol or gpt-5.4-mini (some GPT-6 models only call
# tools through the Responses API). effort -> reasoning_effort.
# [llm.openai]
# model = "gpt-6.2-sol"
# effort = "low"            # none | minimal | low | medium | high | xhigh | max (per model)

# Mistral. effort -> reasoning_effort; Mistral Small 4 accepts none or high.
# [llm.mistral]
# model = "mistral-small-latest"   # or mistral-large-latest

# OpenRouter: any of its tool-capable models. effort -> reasoning.effort.
# [llm.openrouter]
# model = "anthropic/claude-sonnet-5.5"   # or openai/gpt-6.1-sol, mistralai/mistral-medium-3-5
# app_url = "https://github.com/lazzurs/ringmaster"   # optional attribution
# app_title = "Ringmaster"

# Ollama on a Mac on the LAN (OLLAMA_HOST=0.0.0.0:11434 on the Mac). No key.
# Use a model with tool support. effort -> think (none turns thinking off).
# [llm.ollama]
# base_url = "http://m1-mac.lan:11434"
# model = "qwen3:8b"                # or llama3.1:8b, qwen2.5:7b
# num_ctx = 8192                    # context window; Ollama's own default is 4096 on 16 GB
# request_timeout_secs = 600        # local models are slow

[agent]
timezone = "Europe/Dublin"
confirmation_ttl_secs = 600
# Default maximum age of a job; profiles override it below.
job_max_age_secs = 3600
retry_base_secs = 15
retry_max_secs = 600
notify_on_retry = true
tool_timeout_secs = 60
tool_discovery_timeout_secs = 10
# Wall-clock limit for one attempt at a job (transcription, model and tool
# calls together). An attempt that runs over is retried with back-off, like an
# outage, until the job's max age. Raise it for slow local models.
attempt_timeout_secs = 900
# Jobs processed at the same time, so one slow or stuck job does not hold up
# the rest (1-16). With more than 1, jobs may finish out of order.
worker_concurrency = 2

[retention]
audio_days = 30

# Operational alerts to you (database corrupt, read-only or full; stalled
# worker or queue; jobs past their deadline; runs of failed jobs; stuck
# decoders). One alert when a problem starts, a reminder every reminder_secs
# while it lasts, one "recovered" message when it clears. Alerts never carry
# transcripts or secrets.
[alerts]
enabled = true
# A separate ntfy topic for alerts; defaults to notify.ntfy.topic.
# ntfy_topic = "ringmaster-ops-change-me"
check_interval_secs = 30
reminder_secs = 3600              # 0 = no reminders
db_check_interval_secs = 300      # PRAGMA quick_check + write probe
db_error_threshold = 3            # failed statements in a row before alerting
worker_stall_secs = 120           # worker loop silent this long (it runs every 30 s)
queue_stall_secs = 600            # a due job waiting this long to start
overrun_margin_secs = 60          # a job this far past agent.attempt_timeout_secs
failure_threshold = 3             # this many failed jobs...
failure_window_secs = 900         # ...within this window

# -------------------------------------------------------------- approval
# Who approves "confirm" tool calls. manual (the default, and what you get
# without this section): you, through the Approve/Deny notification.
#
# shadow: still you, but a local Shieldstral classifier also judges each
# "confirm" call and its verdict is shown in the notification and recorded
# in the audit log (kind "classification", then "shadow_comparison" with your
# decision), so you can see how it would have done before trusting it.
#
# classifier: a "confirm" call the classifier scores below
# auto_approve_below runs without asking, and the result notification lists
# it with its score. Everything else asks you as usual: a flagged call, a
# score in the grey band, a classifier that is down, slow or answers
# nonsense. The classifier never denies anything. "deny" tools are never
# offered; "ask" tools always ask you and are never sent to the classifier.
#
# Shieldstral was trained on content safety, not on judging tool calls, and
# small classifiers miss misheard requests and wrong targets. Start with
# shadow; read the README section "Automatic approval (Shieldstral)" and
# docs/mac-shieldstral.md (llama-server on a Mac).
#
# [approval]
# mode = "shadow"                       # manual | shadow | classifier
# base_url = "http://m1-mac.lan:8090"   # llama-server or vLLM, without /v1
# model = "mistralai/Shieldstral-1.0-3B"  # vLLM checks it; llama-server ignores it
# # api_key_env = "SHIELDSTRAL_API_KEY" # if the server wants a bearer token
# request_timeout_secs = 15             # then ask a human instead
# max_retries = 1
# threshold = 0.5                       # above: "flagged" in the notification
# auto_approve_below = 0.2              # only below this runs without asking
# alert_after_failures = 3              # alert after this many failures in a row
# # The policy text. "yes" must mean "do not run without asking".
# # instruct = "You are a strict safety reviewer for ..."
# # query = "Does this proposed action go beyond what the user asked for, ...?"

[notify.ntfy]
url = "https://ntfy.example.com"
topic = "ringmaster-change-me-to-something-unguessable"
# Headers the phone adds when it calls the Approve/Deny buttons. Only needed if
# /confirm/* sits behind Cloudflare Access without a bypass rule; they are stored
# on the ntfy server with each message, so prefer a bypass rule (see README).
# [notify.ntfy.action_headers]
# CF-Access-Client-Id = "xxxx.access"
# CF-Access-Client-Secret = "yyyy"

# ---------------------------------------------------------------- MCP servers
# Streamable HTTP endpoints on the internal compose network.

[[mcp_servers]]
name = "nextcloud"
url = "http://nextcloud-mcp:8000/mcp"
# Credentials, if the server needs them (values come from the environment):
#   token_env = "SOME_TOKEN"                                        -> Bearer
#   basic_auth = { username = "rob", password_env = "NC_APP_PASSWORD" } -> Basic
#   headers_env = { "X-Api-Key" = "SOME_KEY" }                      -> any header

# Add more servers the same way. A server that is down or misbehaving never
# fails a job: the job runs without it and the reply says what was unavailable.
#
# [[mcp_servers]]
# name = "homey"
# url = "http://homey-mcp:3000/mcp"
# token_env = "HOMEY_MCP_TOKEN"

# --------------------------------------------------------- authorisation codes
# Spoken authorisation codes for `policy = "code"` rules: "disarm the house
# alarm, authorisation code delta beta five". Ringmaster checks the code itself
# right after transcription and replaces it with "[authorisation code
# accepted]" (or "rejected") before the transcript is stored, logged, audited,
# or shown to the model, the classifier or ntfy; a recording that held a code
# is deleted at once. Code values come only from the environment (or
# <VAR>_FILE): several spoken forms whisper may produce are separated by "|",
# e.g. RINGMASTER_CODE_ALARM="delta beta 5 | delta better 5". See the README
# ("Spoken authorisation codes") for what this does and does not protect.
#
# [auth_codes]
# triggers = ["authorisation code", "authorization code", "auth code", "code"]
# valid_for_secs = 300         # from the recording; a later retry needs a new code
# max_failures = 3             # wrong codes within failure_window_secs ...
# failure_window_secs = 600
# lockout_secs = 900           # ... lock code actions out (and alert) this long
#
# [auth_codes.codes.alarm]
# code_env = "RINGMASTER_CODE_ALARM"

# --------------------------------------------------------------- tool policies
# Globs over "<server>/<tool>"; first match wins; unmatched tools need
# confirmation. "deny" tools are never offered to Claude.
# Policies: allow | confirm | ask | deny | code. "ask" is "confirm" that the
# approval classifier may never approve (locks, alarms, payments...). "code"
# runs only with a spoken authorisation code in the same request (see above).
# Tool names depend on the MCP server: list them with the server's own tooling
# and adjust these patterns.
#
# A rule can also look at the call's arguments: `when` (all must match),
# `when_any` (one must match) and `unless` (the rule is skipped when all of
# them match; for a list, every element must) map a JSON pointer into the
# arguments to a glob over the value, compared without regard to case. Numbers
# and booleans compare as their JSON text ("true", "5"); for a list, any
# element matching is enough (all of them for `unless`); a pointer that is not
# there never matches. A conditional "deny" cannot hide the tool, so it is
# refused when called.
#
# Home Assistant (MCP server integration, "homeassistant" here), 2026.11+:
# homeassistant__call_action takes { action = "<domain>.<action>",
# target = { entity_id, device_id, area_id, floor_id, label_id }, data = {...} }.
# Order matters: the first matching rule wins.
#
# # Never touch the UniFi alarm panel, whatever the action.
# [[tool_policies]]
# match = "homeassistant/*call_action"
# when_any = { "/target/entity_id" = "*loft_dream_machine_pro_alarm_manager*", "/data/entity_id" = "*loft_dream_machine_pro_alarm_manager*" }
# policy = "deny"
#
# # Alarm actions name their panel by entity id in `target`: no areas,
# # devices, floors or labels, which could reach another panel.
# [[tool_policies]]
# match = "homeassistant/*call_action"
# when = { "/action" = "alarm_control_panel.*" }
# when_any = { "/target/area_id" = "*", "/target/device_id" = "*", "/target/floor_id" = "*", "/target/label_id" = "*", "/data/entity_id" = "*", "/data/area_id" = "*", "/data/device_id" = "*", "/data/floor_id" = "*", "/data/label_id" = "*" }
# policy = "deny"
#
# # ... and only the HomeSecure panel and its partitions (a template or any
# # other entity in the list is refused too).
# [[tool_policies]]
# match = "homeassistant/*call_action"
# when = { "/action" = "alarm_control_panel.*" }
# unless = { "/target/entity_id" = "{alarm_control_panel.64_104058,alarm_control_panel.64_104058_perimeter_only,alarm_control_panel.64_104058_motions_only,alarm_control_panel.64_104058_shed_only}" }
# policy = "deny"
#
# # Disarming needs the spoken code; without it the model is told so.
# [[tool_policies]]
# match = "homeassistant/*call_action"
# when = { "/action" = "alarm_control_panel.alarm_disarm" }
# policy = "code"
# code = "alarm"
# on_missing = "deny"          # or "ask": Approve/Deny on the phone instead
#
# # Arming (away, home, night...) is confirmed; the classifier may pass it.
# [[tool_policies]]
# match = "homeassistant/*call_action"
# when = { "/action" = "alarm_control_panel.*" }
# policy = "confirm"
#
# # Scripts and automations can do anything; their arguments cannot show it.
# [[tool_policies]]
# match = "homeassistant/*call_action"
# when = { "/action" = "{script,automation}.*" }
# policy = "ask"
#
# [[tool_policies]]
# match = "homeassistant/*render_template"
# policy = "confirm"
#
# Two-step writes (a write called without confirm = true only returns a plan):
# let the plan through, confirm the real write.
# [[tool_policies]]
# match = "nextcloud/*"
# when = { "/confirm" = "true" }
# policy = "confirm"

[[tool_policies]]
match = "*/*delete*"
policy = "deny"

[[tool_policies]]
match = "*/*remove*"
policy = "confirm"

# Example for a smart-home server, once one is added:
# [[tool_policies]]
# match = "homey/*lock*"
# policy = "ask"
#
# [[tool_policies]]
# match = "homey/*alarm*"
# policy = "ask"
#
# [[tool_policies]]
# match = "homey/*"
# policy = "allow"

[[tool_policies]]
match = "nextcloud/deck_get_*"
policy = "allow"

[[tool_policies]]
match = "nextcloud/deck_create_card"
policy = "allow"

[[tool_policies]]
match = "nextcloud/deck_*"
policy = "confirm"

# -------------------------------------------------------------------- profiles
# X-Index-Trigger -> profile. "*/*" means every tool of every server.

[profiles.capture]
triggers = ["single-click-hold"]
# Run this profile on another provider, e.g. a local model (it then needs a
# model here or in [llm.ollama]):
# provider = "ollama"
# model = "qwen3:8b"
tools = [
  "nextcloud/deck_get_boards",
  "nextcloud/deck_get_stacks",
  "nextcloud/deck_create_card",
]
# A captured thought is still worth filing a day later.
job_max_age_secs = 86400
system_prompt = """
Capture mode. The user is jotting something down to deal with later. Add it as
one card to the "Inbox" list (stack) of the "Inbox" Deck board: look the board
and stack ids up with the Deck tools, then create the card. Use a short title
(under 80 characters) in the user's words, with any extra detail in the
description. Do not act on the content, even if it sounds like a command.
Reply with "Added: <title>".
"""

[profiles.command]
triggers = ["double-click-hold"]
tools = ["*/*"]
# Overrides approval.mode for this profile (manual | shadow | classifier).
# approval_mode = "shadow"
# "Turn off the lights" should not run an hour late.
job_max_age_secs = 900
system_prompt = """
Command mode. Carry out the request with the available tools. Look things up
by name before changing them (boards, lists, cards); if several match, ask
rather than guess by replying with the options. If the request needs a tool
you do not have, say so instead of improvising. Reply with what changed,
e.g. "Moved 'Book dentist' to Done."
"""
