# cargo-deny: licences, advisories, bans and sources.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained notice, not a vulnerability. chrono is a hard dependency of
    # rmcp (and of schemars through it); Ringmaster itself uses jiff. Drop this
    # once rmcp moves off chrono.
    { id = "RUSTSEC-2026-0543", reason = "chrono pulled in by rmcp/schemars; unmaintained notice only" },
]

[licenses]
version = 2
confidence-threshold = 0.8
# Ringmaster is GPL-3.0-or-later, so every licence allowed here must be
# compatible with GPLv3 (it is fine for a dependency to offer one compatible
# option in an OR expression). Do not add GPL-2.0-only, the old OpenSSL/SSLeay
# licence, SSPL, BUSL, Commons Clause or other non-free licences.
allow = [
    # Ringmaster itself (checked too: private crates are not skipped).
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
]
exceptions = [
    # Mozilla's CA root bundle as data. Only a dependency of
    # rustls-platform-verifier on wasm32, never built for the Linux image.
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
