# cargo-deny: licences, advisories, bans and sources.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained notice, not a vulnerability. chrono is a hard dependency of
    # rmcp (and of schemars through it); Ringmaster itself uses jiff. Drop this
    # once rmcp moves off chrono.
    { id = "RUSTSEC-2026-0543", reason = "chrono pulled in by rmcp/schemars; unmaintained notice only" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
